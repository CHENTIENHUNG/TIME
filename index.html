<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>統一時間</title>
  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .wrap {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    .clock {
      font-size: 72px;
      font-weight: bold;
      color: #2563eb;
      margin: 30px 0 10px;
      letter-spacing: 2px;
    }

    .status {
      color: #666;
      margin-bottom: 10px;
      min-height: 24px;
    }

    .last-update {
      color: #444;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .panel {
      margin-top: 20px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 14px;
    }

    label {
      display: block;
      font-size: 18px;
      margin-bottom: 10px;
    }

    input[type="number"] {
      font-size: 24px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 80px;
      text-align: center;
      margin: 4px;
    }

    button {
      margin-top: 16px;
      font-size: 20px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    .tip {
      margin-top: 16px;
      color: #888;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .clock {
        font-size: 46px;
      }

      input[type="number"] {
        width: 60px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>統一時間</h1>

    <div class="clock" id="clock">--:--:--</div>
    <div class="status" id="status">正在連線資料庫...</div>
    <div class="last-update" id="lastUpdate">最後修改時間：--</div>

    <div class="panel">
      <label>輸入新時間</label>

      <input type="number" id="hourInput" min="0" max="23" placeholder="時" />
      <input type="number" id="minuteInput" min="0" max="59" placeholder="分" />
      <input type="number" id="secondInput" min="0" max="59" placeholder="秒" />

      <br />

      <button id="updateBtn">更新統一時間</button>

      <div class="tip">
        所有人都可以修改。<br />
        修改後，所有開著此頁面的人會同步看到新時間。
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7Q3VBppTIuBcz3UsCBSd6w-c_bGQPg4U",
      authDomain: "time-f0661.firebaseapp.com",
      databaseURL: "https://time-f0661-default-rtdb.firebaseio.com",
      projectId: "time-f0661",
      storageBucket: "time-f0661.firebasestorage.app",
      messagingSenderId: "376660412191",
      appId: "1:376660412191:web:fee0481d89a78f8458922a",
      measurementId: "G-J1R21WJB6K"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const timeRef = ref(db, "sharedTime");

    let currentBaseTime = null;
    let currentSetAt = null;
    let timerId = null;

    const clockEl = document.getElementById("clock");
    const statusEl = document.getElementById("status");
    const lastUpdateEl = document.getElementById("lastUpdate");

    const hourInputEl = document.getElementById("hourInput");
    const minuteInputEl = document.getElementById("minuteInput");
    const secondInputEl = document.getElementById("secondInput");

    const updateBtn = document.getElementById("updateBtn");

    function parseHHMMSS(timeStr) {
      const parts = timeStr.split(":").map(Number);
      const h = parts[0] || 0;
      const m = parts[1] || 0;
      const s = parts[2] || 0;
      return { h, m, s };
    }

    function formatTime(dateObj) {
      const hh = String(dateObj.getHours()).padStart(2, "0");
      const mm = String(dateObj.getMinutes()).padStart(2, "0");
      const ss = String(dateObj.getSeconds()).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    }

    function formatDateTime(timestamp) {
      const d = new Date(timestamp);

      const yyyy = d.getFullYear();
      const MM = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");

      return `${yyyy}/${MM}/${dd} ${hh}:${mm}:${ss}`;
    }

    function startLocalClock(baseTime, setAt) {
      currentBaseTime = baseTime;
      currentSetAt = setAt;

      if (timerId) {
        clearInterval(timerId);
      }

      function updateDisplay() {
        const { h, m, s } = parseHHMMSS(currentBaseTime);

        const baseDate = new Date();
        baseDate.setHours(h, m, s, 0);

        const elapsed = Date.now() - currentSetAt;
        const currentDate = new Date(baseDate.getTime() + elapsed);

        clockEl.textContent = formatTime(currentDate);
      }

      updateDisplay();
      timerId = setInterval(updateDisplay, 200);
    }

    onValue(timeRef, (snapshot) => {
      const data = snapshot.val();

      if (!data) {
        clockEl.textContent = "--:--:--";
        statusEl.textContent = "目前尚未設定時間";
        lastUpdateEl.textContent = "最後修改時間：--";
        return;
      }

      if (!data.baseTime || !data.setAt) {
        clockEl.textContent = "--:--:--";
        statusEl.textContent = "資料格式不完整";
        lastUpdateEl.textContent = "最後修改時間：--";
        return;
      }

      startLocalClock(data.baseTime, data.setAt);
      statusEl.textContent = "已同步";

      if (data.updatedAt) {
        lastUpdateEl.textContent = "最後修改時間：" + formatDateTime(data.updatedAt);
      } else {
        lastUpdateEl.textContent = "最後修改時間：--";
      }
    }, (error) => {
      console.error(error);
      statusEl.textContent = "讀取失敗";
    });

    updateBtn.addEventListener("click", async () => {
      const h = Number(hourInputEl.value);
      const m = Number(minuteInputEl.value);
      const s = Number(secondInputEl.value);

      if (
        Number.isNaN(h) || Number.isNaN(m) || Number.isNaN(s) ||
        h < 0 || h > 23 ||
        m < 0 || m > 59 ||
        s < 0 || s > 59
      ) {
        alert("請輸入正確時間：時 0-23、分 0-59、秒 0-59");
        return;
      }

      const value =
        String(h).padStart(2, "0") + ":" +
        String(m).padStart(2, "0") + ":" +
        String(s).padStart(2, "0");

      try {
        const now = Date.now();

        await set(timeRef, {
          baseTime: value,
          setAt: now,
          updatedAt: now
        });

        statusEl.textContent = "更新成功";
      } catch (error) {
        console.error(error);
        statusEl.textContent = "更新失敗";
      }
    });
  </script>
</body>
</html>
